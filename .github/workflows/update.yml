name: Update versions

# Checks for new upstream releases twice a day (npm / PyPI / GitHub Releases).
# Bumps agents/*/agent.json, rebuilds dist/registry.json, and commits
# directly to main. scripts/build.py validates the bumped entries first;
# if validation fails (e.g. upstream changed its URL pattern), nothing is
# committed.

on:
  schedule:
    - cron: "41 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for new versions
        run: python3 scripts/check_updates.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild registry.json (fails the job on invalid entries)
        run: python3 scripts/build.py
        env:
          # After publishing dist/ to a CDN (e.g. render.com), set the
          # ICON_BASE_URL repository variable to e.g. https://<app>.onrender.com/icons
          ICON_BASE_URL: ${{ vars.ICON_BASE_URL || format('https://raw.githubusercontent.com/{0}/main/agents', github.repository) }}
      - name: Commit and push version bumps
        run: |
          if git diff --quiet; then
            echo "All agents up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents dist/registry.json
          git commit -m "chore: bump agent versions

          $(git diff --cached --stat | tail -1)"
          git push
      - name: Open issue for failed update checks
        if: always()
        run: |
          if [ ! -s dist/update-failures.md ]; then
            echo "No update check failures."
            exit 0
          fi
          gh label create update-check --force --description "Automated version update check failures" || true
          cp dist/update-failures.md /tmp/failures.md
          echo >> /tmp/failures.md
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> /tmp/failures.md
          existing=$(gh issue list --label update-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/failures.md
          else
            gh issue create --title "Version update check failures" --body-file /tmp/failures.md --label update-check
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
