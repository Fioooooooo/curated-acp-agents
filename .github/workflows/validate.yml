name: Validate

on:
  pull_request:
    paths:
      - "agents/**"
      - "scripts/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate entries and build registry.json
        run: python3 scripts/build.py
        env:
          # After publishing dist/ to a CDN (e.g. render.com), set the
          # ICON_BASE_URL repository variable to e.g. https://<app>.onrender.com/icons
          ICON_BASE_URL: ${{ vars.ICON_BASE_URL || format('https://raw.githubusercontent.com/{0}/main/agents', github.repository) }}
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: dist/registry.json
